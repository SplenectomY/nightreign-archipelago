# Elden Ring Nightreign player options
#
# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#   goal:
#     heolstor: 15
#     count: 5
#
# That is 15 chances of Heolstor and 5 chances of a Nightlord count as your victory condition.
# A range is the same shape. The number key is a fixed roll. random, random-low,
# random-high, and random-range-low-high are the other rolls.
# An option set is a list. A name in the list is eligible. A name left out is not.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Elden Ring Nightreign template

game: Elden Ring Nightreign
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.

Elden Ring Nightreign:
  # How this slot is completed.
  # heolstor: defeat Heolstor, the Night Aspect.
  # count: defeat nightlord_count distinct Nightlords. Heolstor counts once he is open.
  # specific: defeat the Nightlord named by specific_nightlord.
  goal:
    heolstor: 50
    count: 0
    specific: 0

  # Used only when goal is count. Distinct Nightlord defeats required. 1 to 10.
  # 1 is the shortest seed. 10 is every Nightlord, including DLC when include_dlc is on.
  nightlord_count:
    4: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-10: 0

  # Used only when goal is specific. Ignored for heolstor and count.
  # harmonia, straghess, and everdark_harmonia need include_dlc.
  # An everdark goal still creates that defeat location if include_everdark is off.
  specific_nightlord:
    heolstor: 50
    gladius: 0
    adel: 0
    gnoster: 0
    maris: 0
    libra: 0
    fulghor: 0
    caligo: 0
    harmonia: 0
    straghess: 0
    everdark_gladius: 0
    everdark_adel: 0
    everdark_gnoster: 0
    everdark_maris: 0
    everdark_libra: 0
    everdark_fulghor: 0
    everdark_caligo: 0
    everdark_harmonia: 0

  # false: Heolstor is not a shuffled unlock. He opens locally after heolstor_unlock_count
  # other Nightlord defeats. This forces a few expeditions before the goal.
  # true: Expedition Unlock - Heolstor is in the item pool. Someone has to find it and send it.
  heolstor_in_pool:
    false: 50
    true: 0

  # Other Nightlord defeats required before this slot can open Heolstor.
  # Ignored when heolstor_in_pool is true. 1 to 9.
  heolstor_unlock_count:
    4: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-9: 0

  # true: Everdark Sovereign defeats are locations, and their unlocks are items.
  # false: no Everdark locations or items, unless the specific goal names an Everdark.
  include_everdark:
    true: 50
    false: 0

  # true: Forsaken Hollows Nightlords (Harmonia, Straghess) and their Nightfarers are in the pool.
  # false: base game roster only.
  include_dlc:
    true: 50
    false: 0

  # true: Defeat Tutorial Margit is a location (flag 6012).
  # false: the tutorial fight is not a check.
  tutorial_margit:
    true: 50
    false: 0

  # true: forces the active Nightfarer back to Wylder. The Hold still uses unlocked characters only
  # false: whoever you were in the hold stays active in the tutorial. Janky but playable.
  always_wylder_in_tutorial:
    true: 50
    false: 0

  # Which Hold purchases become locations.
  # none: no shop locations. Shops are stocked like vanilla, no shop items in the pool and purchases are not checks.
  # unique_only: Small Jar Bazaar and Garb Shop rows that have limited stock. Finding the item stocks the shelf. Buying it is the check.
  shop_checks:
    unique_only: 50
    none: 0

  # Nightlords eligible to be the starting expedition. One is chosen at random.
  # This is an option set, not a weight table. Leave a name out to ban it.
  # gladius is Tricephalos. harmonia and straghess are the DLC bosses.
  # Default excludes everdarks, Heolstor, and DLC.
  starting_nightlords:
    - gladius
    - adel
    - gnoster
    - maris
    - libra
    - fulghor
    - caligo

  # Nightfarers unlocked at the start, chosen at random from starting_nightfarer_pool. 1 to 10.
  # 1 is the intended seed. Higher values put fewer Nightfarers in the item pool.
  starting_nightfarers:
    1: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-10: 0

  # Who the starting Nightfarer roll can pick. Option set, not a weight table.
  # Set this to one name to force that character for testing.
  # Scholar and Undertaker are skipped unless include_dlc is on. Anyone left out stays in the item pool.
  starting_nightfarer_pool:
    - wylder
    - guardian
    - ironeye
    - duchess
    - raider
    - revenant
    - recluse
    - executor
    - scholar
    - undertaker

  # Shop rows already stocked at the start. One number is rolled between min and max. 0 to 40.
  # 0 stocks nothing. The two flatstones are infinite and are not checks.
  # If min is above max, generation swaps them.
  starting_shop_min:
    3: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-40: 0
  starting_shop_max:
    6: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-40: 0

  # Default and count goals split counters across (required Nightlords - 1) spheres. Sphere 0 is open.
  # A specific goal uses one sphere. If Heolstor is in the pool, spheres are min(4, other unlocks).
  # Each later sphere requires one more Nightlord defeat. Invaders 6 and up also require Deep of Night.
  # Shop and garb purchases are shuffled into the same spheres.

  # Day 1 night-boss defeats that become locations. 1 to 50.
  day1_boss_count:
    10: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-50: 0

  # Day 2 night-boss defeats that become locations. 1 to 50.
  day2_boss_count:
    10: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-50: 0

  # Evergaol seals that become locations. 1 to 60.
  evergaol_count:
    20: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-60: 0

  # Magician tower openings that become locations. 1 to 100.
  tower_count:
    30: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100: 0

  # Invader kills that become locations. 0 to 70.
  # Counts after 5 are logically gated behind Expedition Unlock - Deep of Night.
  invader_count:
    20: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-70: 0

  # Buried treasure maps (fort tower rooms near bosses)
  # 0 to 100.
  buried_treasure_count:
    40: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0

  # Crimson flask max-use increases (churches and some day bosses). 0 to 60.
  flask_count:
    30: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-60: 0

  # Murk granted by each filler item. The client reads these from the seed. 1 to 100000.
  # Defaults pay 96,000 if a seed places 32 of each, about the full shop.
  murk_purse:
    150: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100000: 0
  murk_bundle:
    300: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100000: 0
  murk_coffer:
    500: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100000: 0
  murk_chest:
    750: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100000: 0
  murk_hoard:
    1300: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100000: 0

  # Starting runes. Useful items, so they take leftover slots before Murk filler. 0 to 100.
  # +1000 can be anywhere. +5000 logically needs one Nightlord defeat. +10000 logically needs the back half of spheres.
  # Received in an expedition: granted immediately and banked. Later runs pay the full bank 5 seconds after flying in. The receiving run skips piles already paid.
  starting_runes_1000_count:
    20: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0
  starting_runes_5000_count:
    10: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0
  starting_runes_10000_count:
    5: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0

  # Death Link. Off ignores deaths and incoming links. Only applies in an expedition.
  death_link:
    false: 50
    true: 0

  # instant: HP to 0. percent: remove death_link_percent of max HP. dice: instant kill on a roll.
  death_link_mode:
    instant: 50
    percent: 0
    dice: 0

  # Used by percent. 1 to 100.
  death_link_percent:
    50: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100: 0

  # Used by dice. 1 to 100. A miss does nothing.
  death_link_chance:
    50: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-100: 0

  # Common Archipelago options.
  # progression_balancing: 0 to 99. Higher pushes progression toward worlds that are behind.
  progression_balancing:
    50: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-99: 0

  # items: full accessibility. minimal: locations can require more than the logical route.
  accessibility:
    items: 50
    minimal: 0

  # These stay lists or name-to-count maps. They are not weight tables.
  # local_items: []
  # non_local_items: []
  # start_inventory: {}
  # start_hints: []
  # start_location_hints: []
  # exclude_locations: []
  # priority_locations: []
