[package]
name = "nrap_host"
version = "0.8.12"
edition = "2021"
description = "External window for the Nightreign Archipelago client"

[[bin]]
name = "nrap"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
