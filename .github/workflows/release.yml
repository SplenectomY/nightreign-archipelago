name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or reuse
        required: true
        default: v0.5.0
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        working-directory: client
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build host
        working-directory: host
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Pack apworld
        shell: bash
        run: python tools/pack_apworld.py

      - name: Stage tester zip
        shell: bash
        run: |
          mkdir -p dist/nightreign-ap
          cp client/target/x86_64-pc-windows-msvc/release/nightreign_ap.dll dist/nightreign-ap/
          cp host/target/x86_64-pc-windows-msvc/release/nrap.exe dist/nightreign-ap/
          cp data/flags.toml dist/nightreign-ap/
          cp docs/INSTALL.md dist/nightreign-ap/
          mkdir -p dist/nightreign-ap/regulation
          cp regulation/regulation.bin dist/nightreign-ap/regulation/
          cp README.md dist/nightreign-ap/
          cat > dist/nightreign-ap/README.txt << 'EOF'
          Nightreign Archipelago

          1. Install Seamless Coop for Nightreign and me3.
          2. Run the MSI. The default folder is C:/NRAP and can be changed in the installer.
          3. Open nrap.exe. Launch writes nightreign-ap.me3 into the me3 profiles folder.
          4. Download nightreign.apworld and Nightreign.yaml from this release. Copy the apworld to your Archipelago installation's custom_worlds folder and the yaml to the Players folder (or give these files to whoever is generating your world). See https://archipelago.gg/tutorial/Archipelago/setup_en#playing-with-custom-worlds for more information.
          5. Generate, host MultiServer, then launch from nrap.exe. Do not also launch nrsc_launcher.exe.

          You do not need Rust or Visual Studio.
          EOF

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = (Select-String -Path client/Cargo.toml -Pattern 'version = "(.+)"').Matches[0].Groups[1].Value
          wix build installer/Package.wxs -ext WixToolset.UI.wixext -d Version=$version -d Stage=dist/nightreign-ap -o dist/NightreignArchipelago.msi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/NightreignArchipelago.msi
            nightreign.apworld
            players/Nightreign.yaml
          body: |
            Tester pack. No Rust or MSVC required.

            `NightreignArchipelago.msi` installs to `C:/NRAP` by default. The installer can change that folder. `nightreign.apworld` and `Nightreign.yaml` stay separate downloads.

            Launch with nrap.exe. It saves host, slot, and password, starts me3, and shows the log. The in-game overlay is a click-through log. Local servers use ws; archipelago.gg uses wss.

            The regulation package is included and enabled. Seamless Coop is tested, including multi-slot sessions.
