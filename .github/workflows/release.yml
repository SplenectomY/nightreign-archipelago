name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or reuse
        required: true
        default: v0.2.0-phase0
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        working-directory: client
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Pack apworld
        shell: bash
        run: python tools/pack_apworld.py

      - name: Stage tester zip
        shell: bash
        run: |
          mkdir -p dist/nightreign-ap
          cp client/target/x86_64-pc-windows-msvc/release/nightreign_ap.dll dist/nightreign-ap/
          cp data/flags.toml dist/nightreign-ap/
          cp profiles/nightreign-ap.me3 dist/nightreign-ap/
          cp nightreign.apworld dist/nightreign-ap/
          cp players/Nightreign.yaml dist/nightreign-ap/
          cp docs/PHASE0_TESTER.md dist/nightreign-ap/
          cp README.md dist/nightreign-ap/
          cat > dist/nightreign-ap/README.txt << 'EOF'
          Nightreign Archipelago — tester pack

          1. Install Seamless Coop for Nightreign and me3.
          2. Unzip this folder to C:/Mods/nightreign-ap/. Keep nightreign_ap.dll and flags.toml together.
          3. Copy nightreign-ap.me3 to the me3 profiles folder. Paths must use forward slashes.
          4. Copy nightreign.apworld to %USERPROFILE%\Archipelago\custom_worlds\ and Nightreign.yaml to the Players folder.
          5. Generate, host MultiServer, then launch with me3. Do not also launch nrsc_launcher.exe.
          6. The console must print NRAP attached and NRAP AP connected.

          The regulation package is not in this zip. Without it the board is vanilla. With it, do not open the expedition board unless the Nightfarer you are controlling has been granted. A locked active Nightfarer exits the game and Windows writes no crash dump.

          You do not need Rust or Visual Studio.
          EOF
          powershell -Command "Compress-Archive -Path dist/nightreign-ap/* -DestinationPath dist/nightreign-ap-windows.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || startsWith(github.ref, 'refs/tags/v0') }}
          generate_release_notes: true
          files: dist/nightreign-ap-windows.zip
          body: |
            Tester pack. No Rust or MSVC required.

            Zip contains `nightreign_ap.dll`, `flags.toml`, me3 profile, apworld, player yaml, and the install notes.

            The regulation package is not included. Board gating crashes are only reproducible with that package, supplied separately.
