name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or reuse
        required: true
        default: v0.5.0
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        working-directory: client
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build host
        working-directory: host
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Pack apworld
        shell: bash
        run: python tools/pack_apworld.py

      - name: Stage tester zip
        shell: bash
        run: |
          mkdir -p dist/nightreign-ap
          cp client/target/x86_64-pc-windows-msvc/release/nightreign_ap.dll dist/nightreign-ap/
          cp host/target/x86_64-pc-windows-msvc/release/nrap-host.exe dist/nightreign-ap/
          cp data/flags.toml dist/nightreign-ap/
          cp docs/INSTALL.md dist/nightreign-ap/
          mkdir -p dist/nightreign-ap/regulation
          cp regulation/regulation.bin dist/nightreign-ap/regulation/
          cp README.md dist/nightreign-ap/
          cat > dist/nightreign-ap/README.txt << 'EOF'
          Nightreign Archipelago — tester pack

          1. Install Seamless Coop for Nightreign and me3.
          2. Unzip this folder to C:/Mods/nightreign-ap/. Keep nightreign_ap.dll and flags.toml together.
          3. Launch writes nightreign-ap.me3 into the me3 profiles folder. Paths use forward slashes.
          4. Download nightreign.apworld and Nightreign.yaml from this release. Copy the apworld to %USERPROFILE%\Archipelago\custom_worlds\ and the yaml to the Players folder.
          5. Generate, host MultiServer, then launch with me3. Do not also launch nrsc_launcher.exe.
          6. The console must print NRAP attached and NRAP AP connected.

          regulation/regulation.bin is included and the profile loads it. Shop rows stay hidden until their release flag is granted. Do not open character select or the expedition board until the log shows the unlock cache armed, or the menu can exit the game. Remove the [[packages]] block to run without that override.

          You do not need Rust or Visual Studio.
          EOF
          powershell -Command "Compress-Archive -Path dist/nightreign-ap/* -DestinationPath dist/nightreign-ap-windows.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/nightreign-ap-windows.zip
            nightreign.apworld
            players/Nightreign.yaml
          body: |
            Tester pack. No Rust or MSVC required.

            `nightreign.apworld` and `Nightreign.yaml` are separate downloads. The zip is the mod: `nightreign_ap.dll`, `nrap-host.exe`, `flags.toml`, me3 profile, regulation.bin, and the install notes.

            Launch with nrap-host.exe. It saves host, slot, and password, starts me3, and shows the log. The in-game overlay is a click-through log. Local servers use ws; archipelago.gg uses wss.

            The regulation package is included and enabled. Seamless Coop is tested, including multi-slot sessions.
